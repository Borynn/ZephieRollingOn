# 出厂默认值（随软件分发，不要在此文件记录用户改动）
#
# 用户的实际设置在 config/auto_click.yaml（gitignore，覆盖更新时保留）。
# 该文件缺失时由此文件提供初值；两者都存在时以 auto_click.yaml 为准。

# 感叹号格奖励的处理模式（检测到「执行任务」按钮 = 踩到 H 类格子时）
#   skip_all           跳过所有奖励 —— 自动三连点跳过（默认）
#   skip_none          不跳过任何奖励 —— 直接停止脚本，由你自行处理
#   skip_except_hammer 不跳过白金锤子 —— 检测到白金锤子才停，否则照常跳过
# 旧版本此项是 true/false 开关，仍可读取（true → skip_all，false → skip_none）。
skip_exclamation_reward: skip_all

# 投骰/用卡后跳过动画（interception 下按 F12，其余点击开关界面）
skip_animation_via_f12: true

# 可用骰子为 0 时自动补充
auto_replenish_dice: true

# 脚本操作期间屏蔽游戏区鼠标输入（当前未启用；见 executor/mouse_shield.py）
block_mouse_in_game: false

# 统一点击间隔基准（毫秒），最低 50
# 实际间隔 = 基准 ±20ms 随机，且不低于 50（例：100 → 80~120；50 → 50~70）
click_interval_ms: 100

# 点击间隔的随机扰动幅度（毫秒），范围 0~1000，0 = 关闭扰动
# 真人不会每次都用同一个间隔，固定间隔本身也是一种可识别的规律。
# 本项没有界面，改这里后重启生效。
click_interval_jitter_ms: 20

# 操作后连续同格的次数达到该值，判定未点上并重放上次操作
same_cell_retry_after: 3

# 「开新局」时序（毫秒）。检测到 START 表示本局结束，但局末结算动画**无法跳过**，
# 必须等它放完再点，否则两次点击会落在动画上而失效（表现为检测到 START 却开不出新局）。
# 慢机器/低配机动画更久，可按需调大。本两项没有界面，改这里后重启生效。
new_round_pre_click_wait_ms: 2000

# 两次开新局点击完成后，等待开局动画，之后才开始识别新局骰子
new_round_animation_wait_ms: 3000
