# Exact dependency pins for reproducible builds — generated by
# `python -m pip freeze` from the `zephie_rolling_on` conda env.
#
# Why this exists alongside requirements.txt:
#   requirements.txt states only lower bounds (e.g. `numpy>=1.24.0`), so a build
#   resolves to whatever is newest at that moment. CI therefore drifted from
#   local builds. This file pins the full tree (runtime AND build tools such as
#   PyInstaller) so CI and local produce the same dependency set.
#
# Regenerate after intentionally upgrading:
#   python -m pip freeze > requirements.lock   # then re-apply the two fixes below
#
# Two entries from a raw `pip freeze` must never be committed:
#   - the project's own editable install (`-e git+...`): CI checks out the code
#   - conda-provided dists recorded as `name @ file:///home/conda/...`: not
#     installable outside the build machine (packaging was such an entry)
#
# Python itself (and its Tcl/Tk) comes from conda, not from here: conda-forge's
# `python` declares `tk` as a dependency, so `setup-miniconda` with 3.11 supplies
# the same Library\lib\tcl8.6 layout the build script syncs from.

