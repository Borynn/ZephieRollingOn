[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zephie-rolling-on"
version = "1.0.1"
description = "Zephie Rolling On — game assist UI, recognition, auto-click, decision DLL client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Non-Commercial (see LICENSE)" }
authors = [{ name = "Zephie Rolling On contributors" }]
dependencies = [
  "openpyxl>=3.1.0",
  "pyyaml>=6.0",
  "numpy>=1.24.0",
  "mss>=9.0.0",
  "opencv-python-headless>=4.8.0",
  "Pillow>=10.0.0",
  "rapidocr>=2.0.0",
  "onnxruntime>=1.16.0",
  "pywin32>=306; platform_system == 'Windows'",
  "windows-capture>=2.0; platform_system == 'Windows'",
]

[project.optional-dependencies]
easyocr = ["easyocr>=1.7.0"]
dev = ["pytest>=7.0"]

[project.scripts]
zephie-rolling-on = "zephie_rolling_on.ui:run_app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zephie_rolling_on = ["py.typed"]
