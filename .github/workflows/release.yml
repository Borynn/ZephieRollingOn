name: Release

# Builds the portable Windows package and attaches it to a GitHub Release.
#
# Triggered by pushing a version tag (`v1.0.1`); the tag must match the version
# hardcoded in scripts/build_portable.ps1, otherwise the job fails early rather
# than publishing a mislabelled artifact.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # required to create the release and upload the asset

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # conda rather than `setup-python`, to match how the package is built
      # locally. Two reasons:
      #   1. The build script syncs Tcl/Tk from the interpreter prefix
      #      (`Library\lib\tcl8.6`, `Library\bin`) — a conda-only layout. A
      #      python.org interpreter has no such paths, so that step would
      #      silently do nothing.
      #   2. conda-forge's `python` declares `tk` as a dependency, so Tcl/Tk is
      #      supplied the same way as locally.
      # Python 3.11 on purpose: the bundled native engine is a `cp311` extension
      # (`vela_official*.cp311-win_amd64.pyd`), which no other version can import.
      - name: Set up conda environment (Python 3.11)
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          activate-environment: zephie_rolling_on
          auto-activate-base: false
          miniforge-version: latest

      # Fails fast and offline: a floor bumped in requirements.txt without
      # regenerating the lock would otherwise keep building on the old pin.
      # The logic lives in a script, not inline: it needs PEP 440 version
      # comparison, and `scripts/` is where this project keeps its gates.
      - name: Verify lock satisfies requirements.txt
        shell: pwsh
        run: python scripts/check_lock.py

      # The lock, not requirements.txt: the latter states only lower bounds, so
      # builds would drift as new releases appear. The lock also carries the build
      # toolchain (PyInstaller, setuptools) so CI and local agree exactly.
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      # Surfaces the Tcl/Tk layout in the log. If a build ever fails, this says
      # immediately whether the cause is a missing interpreter-prefix layout.
      - name: Report build environment
        shell: pwsh
        run: |
          $prefix = python -c "import sys; print(sys.prefix)"
          Write-Host "python      : $(python -c 'import sys; print(sys.version)')"
          Write-Host "sys.prefix  : $prefix"
          foreach ($rel in @("Library\lib\tcl8.6", "Library\lib\tk8.6", "Library\bin")) {
            $p = Join-Path $prefix $rel
            $state = if (Test-Path $p) { "present" } else { "MISSING" }
            Write-Host ("  {0,-24} {1}" -f $rel, $state)
          }
          Write-Host "key pins:"
          python -m pip show pillow numpy onnxruntime opencv-python-headless rapidocr pyinstaller 2>$null |
            Select-String -Pattern '^(Name|Version):' | ForEach-Object { "  $($_.Line.Trim())" }

      # A tag/script mismatch would publish an artifact whose name and contents
      # disagree; catch it before spending build minutes.
      - name: Verify tag matches the build script version
        shell: pwsh
        run: |
          $declared = (Select-String -Path scripts\build_portable.ps1 -Pattern '^\$Version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "build script version: $declared"
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}".TrimStart("v")
            if ($tag -ne $declared) {
              throw "tag v$tag does not match scripts/build_portable.ps1 version $declared"
            }
          }
          "VERSION=$declared" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Fails fast (and legibly) if a required runtime component is missing from
      # the tree; otherwise the breakage would only show up in a user's install.
      - name: Verify bundled runtime components
        shell: pwsh
        run: |
          $required = @(
            "model_host.exe",
            "native/vela/vela_official.cp311-win_amd64.pyd",
            "native/vela/vela_official_v41.cp311-win_amd64.pyd",
            "map.xlsx", "LICENSE", "NOTICE",
            "docs/USER_README_ZH.txt",
            "decision_models/vela_v4.1.vpk",
            "decision_models/zephie_m1_points.zm"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "missing required files: $($missing -join ', ')" }
          Write-Host "all $($required.Count) required components present"

      - name: Build portable package
        shell: pwsh
        run: ./scripts/build_portable.ps1

      # The bundled model packages are ~58 MB combined; if they are missing the
      # release would look fine but be useless to a user, so check here too.
      - name: Verify model packages were bundled
        shell: pwsh
        run: |
          $out = "dist/ZephieRollingOn_v$env:VERSION"
          foreach ($m in @("decision_models/vela_v4.1.vpk", "decision_models/zephie_m1_points.zm")) {
            $p = Join-Path $out $m
            if (-not (Test-Path $p)) { throw "model package not bundled: $m" }
            Write-Host ("  {0,-40} {1,12:N0} B" -f $m, (Get-Item $p).Length)
          }

      - name: Package
        shell: pwsh
        run: |
          $dir = "dist/ZephieRollingOn_v$env:VERSION"
          if (-not (Test-Path $dir)) { throw "build output not found: $dir" }
          $zip = "ZephieRollingOn_v$env:VERSION.zip"
          Compress-Archive -Path $dir -DestinationPath $zip -CompressionLevel Optimal
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "created $zip ($mb MB)"
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZephieRollingOn_v${{ env.VERSION }}
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A manual run (workflow_dispatch) is for building and checking the
          # package, not for publishing. This used to be a silent `if:` on the
          # step, which produced a green run with no release and no explanation.
          if ("${{ github.ref_type }}" -ne "tag") {
            Write-Host "::warning::ref_type=${{ github.ref_type }} (not a tag) — built and uploaded the artifact, but skipped release creation."
            exit 0
          }

          $tag = "${{ github.ref_name }}"
          $repo = $env:GITHUB_REPOSITORY

          # Re-running for a tag that already has a release would fail with
          # "release already exists". Replace it, so a re-release needs no manual
          # cleanup (and deleting the release leaves the tag intact).
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag already exists — replacing it"
            gh release delete $tag --repo $repo --yes
          }

          # Built as an array, not a here-string: PowerShell requires a here-string
          # terminator at column 0, which YAML indentation cannot satisfy.
          # Backticks are avoided for the same reason (they escape in "")
          # strings) -- 「」 carries the emphasis instead.
          $notes = @(
            "便携版 ZephieRollingOn v$env:VERSION。",
            "",
            "解压后运行 「ZephieRollingOn!.exe」 即可。启动时会请求管理员权限，",
            "这是正常现象：截屏与点击注入需要提权，否则点击会被游戏静默丢弃。",
            "",
            "已内置决策模型包：vela_v4.1、m1_points，无需另行下载。",
            "其他模型（如 vela_v4，约 1 GB）请从发布页单独获取后放入 decision_models/。",
            "",
            "交流 QQ 群：582530986"
          ) -join "`n"
          gh release create $tag $env:ZIP --title "ZephieRollingOn v$env:VERSION" --notes $notes
